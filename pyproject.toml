[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dashcam-semantic-recall"
version = "0.2.0"
description = "Dashcam video semantic search and precise replay system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.5",
  "python-vlc>=3.0.20123",
]
backend = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "passlib[bcrypt]>=1.7",
  "PyJWT>=2.8",
  "numpy>=1.26",
]
ai = [
  "sentence-transformers>=2.7",
  "openai>=1.30",
]
media = [
  "ffmpeg-python>=0.2",
  "Pillow>=10.0",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "apps/desktop_client",
  "apps/backend",
]

[tool.setuptools.packages.find]
where = ["apps/desktop_client", "apps/backend"]
