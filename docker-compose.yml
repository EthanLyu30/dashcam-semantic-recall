# One-command backend stack: PostgreSQL (native vector cosine) + FastAPI.
# Usage:
#   docker compose up --build
#   # API at http://127.0.0.1:8000  (Swagger: /docs)
#
# The desktop client still runs on the host (GUI); point it at the API with:
#   $env:DVR_SEMANTIC_API_BASE = "http://127.0.0.1:8000"; python apps/desktop_client/main.py
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dvr_semantic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dvr_semantic"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DVR_SEMANTIC_DB_URL: postgresql://postgres:postgres@db:5432/dvr_semantic
      MEDIA_ROOT: /data/media
      # Override before any real deployment (the default is a public dev value).
      DVR_SEMANTIC_JWT_SECRET: change-me-please-32-bytes-minimum
      # Optional: enable the FR-06 integration surface.
      # DVR_SEMANTIC_INTEGRATION_API_KEYS: my-partner-key
    ports:
      - "8000:8000"
    volumes:
      - mediadata:/data/media

volumes:
  pgdata:
  mediadata:
