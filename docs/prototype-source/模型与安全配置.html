<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>模型与安全配置 - DVR-Semantic</title>
<script src="resources/scripts/tailwindcss.3.4.3.js"></script>
<script src="resources/scripts/iconify-icon.min.1.0.7.js"></script>
<style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        main { overflow-y: auto; height: 100vh; }
    </style>
</head>
<body class="bg-transparent font-sans text-slate-800 antialiased font-sans text-gray-900">
<div class="min-h-screen flex flex-col bg-transparent relative">
    <div class="fixed inset-0 z-[-1] bg-[#F8FAFC] pointer-events-none overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-blue-400/20 blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-400/20 blur-[120px]"></div>
        <div class="absolute top-[40%] left-[60%] w-[30%] h-[30%] rounded-full bg-cyan-400/10 blur-[100px]"></div>
        <div class="absolute inset-0 bg-[url('resources/images/noise.svg')] opacity-[0.015] mix-blend-overlay"></div>
    </div>
    
<!-- 侧边导航栏 -->


    <header class="sticky top-0 z-50 bg-[#F8FAFC]/50 backdrop-blur-2xl border-b border-slate-100/60/50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-[0_10px_40px_rgb(0,0,0,0.06)] shadow-blue-500/30">
                        <iconify-icon class="text-2xl text-white" icon="solar:videocamera-record-bold-duotone"></iconify-icon>
                    </div>
                    <span class="text-xl font-black tracking-widest text-slate-800 font-black tracking-widest">DVR-S</span>
                </div>
                
                <!-- Nav Links -->
                <nav class="hidden md:flex space-x-1">
                    <a href="系统状态概览.html" class="px-4 py-2 rounded-lg text-sm font-medium transition-all hover:bg-slate-100 hover:text-blue-600 text-slate-600">概览</a>
                    <a href="语义检索中心.html" class="px-4 py-2 rounded-lg text-sm font-medium transition-all hover:bg-slate-100 hover:text-blue-600 text-slate-600">检索</a>
                    <a href="视频库管理.html" class="px-4 py-2 rounded-lg text-sm font-medium transition-all hover:bg-slate-100 hover:text-blue-600 text-slate-600">视频流</a>
                    <a href="人工复核中心.html" class="px-4 py-2 rounded-lg text-sm font-medium transition-all hover:bg-slate-100 hover:text-blue-600 text-slate-600">复核</a>
                    <a href="告警管理中心.html" class="px-4 py-2 rounded-lg text-sm font-medium transition-all hover:bg-slate-100 hover:text-blue-600 text-slate-600">告警</a>
                    <a href="事故摘要预览.html" class="px-4 py-2 rounded-lg text-sm font-medium transition-all hover:bg-slate-100 hover:text-blue-600 text-slate-600">事故</a>
                    <a href="证据与日志归档.html" class="px-4 py-2 rounded-lg text-sm font-medium transition-all hover:bg-slate-100 hover:text-blue-600 text-slate-600">证据与日志</a>
                    <a href="全天业务报告.html" class="px-4 py-2 rounded-lg text-sm font-medium transition-all hover:bg-slate-100 hover:text-blue-600 text-slate-600">全天业务报告</a>
                </nav>

                <!-- Right End Profile -->
                <div class="flex items-center gap-4">
                    <a href="模型与安全配置.html" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-slate-100 transition-colors text-slate-500">
                        <iconify-icon class="text-xl" icon="solar:settings-bold-duotone"></iconify-icon>
                    </a>
                    <a href="角色与权限管理.html" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-slate-100 transition-colors text-slate-500">
                        <iconify-icon class="text-xl" icon="solar:user-bold-duotone"></iconify-icon>
                    </a>
                    <a href="系统登录.html" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-red-50 hover:text-red-500 transition-colors text-slate-500">
                        <iconify-icon class="text-xl" icon="solar:logout-2-bold-duotone"></iconify-icon>
                    </a>
                </div>
            </div>
        </div>
    </header>
    
<main class="flex-1 w-full max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
<header class="h-16 bg-white  border-b border-slate-100/60/50  flex items-center justify-between px-8 flex-shrink-0">
<h2 class="text-xl font-bold text-gray-800">系统参数与模型配置</h2>
</header>
<div class="flex-1 overflow-y-auto p-6 max-w-4xl">
<!-- 核心配置板块 -->
<div class="space-y-8">
<!-- 多模态模型配置 -->
<section class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-[0_2px_10px_rgb(0,0,0,0.02)]">
<div class="p-6 border-b border-slate-50 bg-white/50">
<h4 class="font-bold text-slate-800 flex items-center gap-2">
<iconify-icon class="text-blue-500 text-xl" icon="solar:atom-bold-duotone"></iconify-icon>
                                多模态大模型引擎 (LLM/VLM)
                            </h4>
<p class="text-xs text-slate-500 mt-1">配置用于视频帧理解及语义标签生成的底层模型接口参数。</p>
</div>
<div class="p-6 space-y-4">
<div class="grid grid-cols-2 gap-6">
<div>
<label class="block text-xs font-bold text-slate-500 mb-2 uppercase">模型服务商</label>
<select class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-medium">
<option>OpenAI GPT-4o-Vision</option>
<option>Anthropic Claude 3.5 Sonnet</option>
<option>Google Gemini 1.5 Pro</option>
<option selected="">本地自研多模态模型 (DVR-L1)</option>
</select>
</div>
<div>
<label class="block text-xs font-bold text-slate-500 mb-2 uppercase">API Endpoint</label>
<input class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-mono" type="text" value="https://api.internal-dvr.net/v1/semantic"/>
</div>
</div>
<div>
<label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">API Key (加密存储)</label>
<div class="relative">
<input class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-mono" type="password" value="sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"/>
<iconify-icon class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer" icon="solar:eye-linear"></iconify-icon>
</div>
<p class="text-[10px] text-slate-400 mt-2">提示：根据 SRS 1.3 节要求，此 Key 仅在服务端安全容器内解密使用。</p>
</div>
</div>
</section>
<!-- 视频预处理与存储策略 -->
<section class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-[0_2px_10px_rgb(0,0,0,0.02)]">
<div class="p-6 border-b border-slate-50 bg-white/50">
<h4 class="font-bold text-slate-800 flex items-center gap-2">
<iconify-icon class="text-blue-500 text-xl" icon="solar:database-bold-duotone"></iconify-icon>
                                预处理与存储路径 (Storage)
                            </h4>
</div>
<div class="p-6 space-y-6">
<div class="grid grid-cols-3 gap-6">
<div>
<label class="block text-xs font-bold text-slate-500 mb-2 uppercase">切片时长 (S)</label>
<input class="w-full px-4 py-2 bg-white border border-slate-200 rounded-lg outline-none text-sm" type="number" value="30"/>
</div>
<div>
<label class="block text-xs font-bold text-slate-500 mb-2 uppercase">抽帧频率 (FPS)</label>
<input class="w-full px-4 py-2 bg-white border border-slate-200 rounded-lg outline-none text-sm" type="number" value="1"/>
</div>
<div>
<label class="block text-xs font-bold text-slate-500 mb-2 uppercase">语义识别阈值</label>
<input class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer mt-4" max="100" min="0" type="range" value="75"/>
</div>
</div>
<div>
<label class="block text-xs font-bold text-slate-500 mb-2 uppercase">存储根目录</label>
<input class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl outline-none text-sm font-mono" type="text" value="/mnt/storage/dvr_processed_data/2026_archive/"/>
</div>
</div>
</section>
<!-- 安全策略 (OAuth2.0 / Bearer Token) -->
<section class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-[0_2px_10px_rgb(0,0,0,0.02)]">
<div class="p-6 border-b border-slate-50 bg-white/50 flex justify-between items-center">
<h4 class="font-bold text-slate-800 flex items-center gap-2">
<iconify-icon class="text-red-500 text-xl" icon="solar:shield-keyhole-bold-duotone"></iconify-icon>
                                接口安全鉴权 (Security)
                            </h4>
<span class="px-2 py-1 bg-green-50 text-green-600 text-[10px] font-bold rounded">Bearer Token 模式启用</span>
</div>
<div class="p-6">
<div class="flex items-center justify-between p-4 bg-white rounded-xl mb-6">
<div>
<p class="text-sm font-bold text-slate-800">身份认证令牌有效期</p>
<p class="text-xs text-slate-500">控制 Bearer Token 的强制更新频率，保障接口调用幂等性。</p>
</div>
<select class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-bold outline-none">
<option>2 小时 (推荐)</option>
<option>24 小时</option>
<option>7 天</option>
</select>
</div>
<div class="flex items-center gap-3">
<button class="flex-1 py-3 bg-slate-800 text-white rounded-xl text-sm font-bold hover:bg-slate-900 transition-all">保存所有全局设置</button>
<button class="px-6 py-3 border border-red-200 text-red-600 rounded-xl text-sm font-bold hover:bg-red-50 transition-all">恢复出厂默认值</button>
</div>
</div>
</section>
</div>
</div>
</main>
</div>
</body>
</html>
