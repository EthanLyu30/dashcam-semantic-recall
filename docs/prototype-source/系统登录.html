<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>系统登录 - DVR-Semantic</title>
<script src="resources/scripts/tailwindcss.3.4.3.js"></script>
<script src="resources/scripts/iconify-icon.min.1.0.7.js"></script>
</head>
<body class="bg-transparent font-sans text-slate-800 antialiased font-sans text-slate-100 flex items-center justify-center h-screen relative overflow-hidden">
<!-- 装饰性背景 -->
<div class="absolute inset-0 opacity-20 pointer-events-none">
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-500 rounded-full blur-[120px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600 rounded-full blur-[120px]"></div>
</div>
<!-- 登录卡片 -->
<div class="relative w-full max-w-md p-6 bg-slate-800/50 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-2xl">
<!-- 品牌标识 -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-20 h-20 bg-blue-600 text-white rounded-3xl shadow-xl shadow-blue-500/20 mb-6 group hover:rotate-6 transition-transform">
<iconify-icon class="text-5xl" icon="solar:videocamera-record-bold-duotone"></iconify-icon>
</div>
<h1 class="text-2xl font-bold tracking-tight text-slate-800 tracking-tight text-white mb-2 font-black tracking-widest">DVR-S</h1>
<p class="text-slate-400 text-sm font-medium">无人机巡检与视频语义检索系统</p>
</div>
<!-- 登录表单 -->
<form class="space-y-6" onsubmit="event.preventDefault(); window.location.href='系统状态概览.html'">
<div>
<label class="block text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-widest">工号 / 手机号 (User Account)</label>
<div class="relative">
<input class="w-full pl-12 pr-4 py-3.5 bg-slate-900/50 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm transition-all text-white placeholder:text-slate-600" placeholder="NY-2026-0327" type="text"/>
<iconify-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-xl text-blue-500" icon="solar:user-bold"></iconify-icon>
</div>
</div>
<div>
<label class="block text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-widest">安全登录密码 (Password)</label>
<div class="relative">
<input class="w-full pl-12 pr-4 py-3.5 bg-slate-900/50 border border-white/10 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm transition-all text-white placeholder:text-slate-600" placeholder="••••••••" type="password"/>
<iconify-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-xl text-blue-500" icon="solar:lock-password-bold"></iconify-icon>
</div>
</div>
<!-- 角色选择 -->
<div class="grid grid-cols-3 gap-3 pt-2">
<label class="cursor-pointer group">
<input checked="" class="sr-only peer" name="role" type="radio"/>
<div class="p-2 text-center bg-slate-900/50 border border-white/10 rounded-xl peer-checked:bg-blue-600 peer-checked:border-blue-500 transition-all">
<p class="text-[10px] font-bold text-slate-400 peer-checked:text-white">巡查员</p>
</div>
</label>
<label class="cursor-pointer group">
<input class="sr-only peer" name="role" type="radio"/>
<div class="p-2 text-center bg-slate-900/50 border border-white/10 rounded-xl peer-checked:bg-blue-600 peer-checked:border-blue-500 transition-all">
<p class="text-[10px] font-bold text-slate-400 peer-checked:text-white">车队管</p>
</div>
</label>
<label class="cursor-pointer group">
<input class="sr-only peer" name="role" type="radio"/>
<div class="p-2 text-center bg-slate-900/50 border border-white/10 rounded-xl peer-checked:bg-blue-600 peer-checked:border-blue-500 transition-all">
<p class="text-[10px] font-bold text-slate-400 peer-checked:text-white">车主</p>
</div>
</label>
</div>
<div class="flex items-center justify-between text-[11px] font-bold px-1">
<label class="flex items-center gap-2 cursor-pointer text-slate-500 hover:text-slate-300 transition-colors">
<input class="w-4 h-4 rounded border-white/10 bg-slate-900 accent-blue-600" type="checkbox"/> 记住此设备
                </label>
<a class="text-blue-500 hover:text-blue-400 transition-colors" href="#">忘记密码？</a>
</div>
<button class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl text-sm font-bold shadow-xl shadow-blue-500/20 transition-all active:scale-[0.98]" type="submit">
                安全登录 (Sign In)
            </button>
</form>
<div class="mt-8 text-center">
<p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-4">系统安全合规 (Compliance)</p>
<div class="flex items-center justify-center gap-4 text-slate-400 text-xs">
<div class="flex items-center gap-1"><iconify-icon icon="solar:shield-check-linear"></iconify-icon> OAuth 2.0</div>
<div class="flex items-center gap-1"><iconify-icon icon="solar:lock-bold"></iconify-icon> SSL加密</div>
<div class="flex items-center gap-1"><iconify-icon icon="solar:history-linear"></iconify-icon> 操作审计</div>
</div>
</div>
</div>
<!-- 版权信息 -->
<div class="absolute bottom-6 text-[10px] text-slate-600 font-bold tracking-[0.2em] uppercase">
        © 2026 DVR-Semantic System. All Rights Reserved.
    </div>
</body>
</html>
